[package]
name = "daemon-desktop"
version = "1.0.0"
description = "Daemon local-first engineering agent desktop"
authors = ["Daemon contributors"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
