[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daemon-agent"
version = "0.1.0"
description = "Daemon - an open-source, provider-agnostic AI engineering agent that lives in your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daemon contributors" }]
keywords = ["ai", "agent", "cli", "coding-agent", "llm", "mcp", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
keyring = ["keyring>=24.0"]
crypto = ["cryptography>=42.0"]
repl = ["prompt_toolkit>=3.0.0"]
dev = ["pytest>=8.0", "requests>=2.31.0"]

[project.scripts]
daemon = "daemon.cli:main"

[tool.setuptools.packages.find]
include = ["daemon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
