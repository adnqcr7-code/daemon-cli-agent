[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daemon-agent"
version = "0.2.1"
description = "Daemon - an open-source, provider-agnostic AI engineering agent that lives in your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daemon contributors" }]
keywords = [
    "ai",
    "ai-coding-assistant",
    "ai-agent",
    "coding-agent",
    "cli",
    "developer-tools",
    "llm",
    "mcp",
    "model-context-protocol",
    "ollama",
    "python",
    "terminal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/adnqcr7-code/daemon-cli-agent"
Repository = "https://github.com/adnqcr7-code/daemon-cli-agent"
Issues = "https://github.com/adnqcr7-code/daemon-cli-agent/issues"
Changelog = "https://github.com/adnqcr7-code/daemon-cli-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
keyring = ["keyring>=24.0"]
crypto = ["cryptography>=42.0"]
repl = ["prompt_toolkit>=3.0.0"]
# dev includes cryptography + ruff: without cryptography the vault/e2e
# tests fail on a fresh clone (the encrypted backend has no backend).
dev = ["pytest>=8.0", "requests>=2.31.0", "cryptography>=42.0", "ruff>=0.4.0"]

[project.scripts]
daemon = "daemon.cli:main"

[tool.setuptools.packages.find]
include = ["daemon*"]

[tool.setuptools.package-data]
daemon = ["evals/**/*.json", "evals/**/*.py", "evals/**/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# E501: long lines are tolerated; keep diffs readable instead.
# UP042: Effect must stay `class Effect(str, Enum)` — StrEnum would change
# str(Effect.ALLOW) from "Effect.ALLOW" to "allow" (audit/log output).
ignore = ["E501", "UP042"]

